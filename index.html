<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - ADSO SENA</title>
    <!-- Tailwind CSS para los estilos -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">
    
    <div class="bg-white w-full max-w-md p-6 rounded-xl shadow-md">
        <h1 class="text-2xl font-bold text-slate-800 mb-2">Mi Gestor de Tareas</h1>
        <p class="text-sm text-slate-500 mb-6">Actividad Firebase - ADSO SENA</p>
        
        <!-- Formulario para agregar tareas -->
        <form id="task-form" class="flex gap-2 mb-6">
            <input 
                type="text" 
                id="task-input" 
                placeholder="Escribe una nueva tarea..." 
                class="flex-1 border border-slate-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500" 
                required
            >
            <button 
                type="submit" 
                class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-4 py-2 rounded-lg transition-colors"
            >
                Guardar
            </button>
        </form>

        <!-- Lista de tareas en tiempo real -->
        <div class="space-y-3">
            <h2 class="text-sm font-semibold text-slate-600 uppercase tracking-wider">Tareas pendientes:</h2>
            <ul id="task-list" class="space-y-2">
                <!-- Las tareas se cargarán aquí dinámicamente -->
            </ul>
        </div>
    </div>

    <!-- Archivo de lógica JavaScript -->
    <script type="module" src="app.js"></script>
</body>
</html>
